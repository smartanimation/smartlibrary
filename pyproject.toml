[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpipeline"
version = "0.1.0"
description = "Production pipeline toolkit for CG and animation workflows."
requires-python = ">=3.10"
dependencies = [
    "pyaaf2>=1.7,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
color = ["numpy>=1.24,<3", "OpenImageIO>=3,<4", "opencolorio>=2.4,<3"]
sheets = ["gspread>=6,<7"]
usd = ["usd-core>=25"]
dev = [
    "PySide6>=6.8,<7",
    "pytest>=9,<10",
]

[project.scripts]
smartlauncher = "smartlib.apps.launcher.main:main"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"smartlib.apps.launcher" = ["ui/*.ui"]
"smartlib.apps.smart_camera_playblast" = ["*.svg"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
