[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpipeline"
version = "0.1.0"
description = "Production pipeline toolkit for CG and animation workflows."
requires-python = ">=3.10"
dependencies = [
    "pyaaf2>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
smartlauncher = "smartlib.apps.launcher.main:main"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"smartlib.apps.launcher" = ["ui/*.ui"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
