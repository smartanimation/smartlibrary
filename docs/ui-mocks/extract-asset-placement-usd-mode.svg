  <rect class="bg" width="430" height="720"/>
  <rect class="panel" x="12" y="10" width="406" height="700" rx="2"/>

  <text class="title" x="24" y="33">Scene Asset Extractor</text>
  <text class="tiny" x="24" y="49">Extract scene objects, hide sources, place locators, and tag USD composition mode.</text>

  <rect class="panel2" x="24" y="63" width="382" height="78"/>
  <rect fill="#5a5a5a" x="34" y="73" width="104" height="58"/>
  <g transform="translate(70 84)">
    <path d="M18 16 L40 20 L40 42 L18 38 Z" fill="#e3b7b7" stroke="#222"/>
    <path d="M20 17 L20 2 Q20 -1 25 0 L37 3 Q40 4 40 8 L40 19" fill="#e8c0c0" stroke="#222"/>
    <path d="M20 38 L16 54 M39 42 L45 56 M26 40 L26 57" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 54 L8 56 M45 56 L54 55 M26 57 L19 59" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect class="button" x="286" y="90" width="104" height="28" rx="1"/>
  <text class="buttonText" x="310" y="108">Select Contents</text>
  <text class="tiny" x="150" y="85">Run a command</text>
  <rect class="button" x="150" y="94" width="24" height="20" rx="1"/>
  <text class="text" x="158" y="108">↻</text>
  <rect class="button" x="178" y="94" width="24" height="20" rx="1"/>
  <text class="text" x="187" y="108">□</text>
  <rect class="button" x="206" y="94" width="24" height="20" rx="1"/>
  <text class="text" x="214" y="108">⌂</text>

  <line class="line" x1="24" y1="158" x2="406" y2="158"/>
  <text class="section" x="24" y="178">Extraction Defaults</text>

  <text class="label" x="42" y="203">Category</text>
  <rect class="field" x="92" y="190" width="98" height="20"/>
  <text class="text" x="98" y="204">prop</text>
  <text class="label" x="218" y="203">Group</text>
  <rect class="field" x="258" y="190" width="98" height="20"/>
  <text class="text" x="264" y="204">bp</text>

  <text class="label" x="47" y="231">Variant</text>
  <rect class="field" x="92" y="218" width="98" height="20"/>
  <text class="text" x="98" y="232">default</text>
  <text class="label" x="202" y="231">Department</text>
  <rect class="fieldFocus" x="258" y="218" width="98" height="20"/>
  <text class="text" x="264" y="232">model</text>

  <text class="label" x="52" y="259">Subset</text>
  <rect class="field" x="92" y="246" width="98" height="20"/>
  <text class="text" x="98" y="260">proxy</text>
  <path d="M178 254 L184 254 L181 258 Z" fill="#bdbdbd"/>
  <rect class="check" x="258" y="249" width="12" height="12" rx="1"/>
  <path d="M261 255 L264 258 L268 252" fill="none" stroke="#f2f2f2" stroke-width="1.6"/>
  <text class="text" x="276" y="259">Auto-name from selection</text>

  <line class="line" x1="24" y1="284" x2="406" y2="284"/>
  <text class="section" x="24" y="304">Extracted Assets / Placement</text>
  <text class="tiny" x="245" y="304">USD Mode is stored on the locator for export.</text>

  <rect class="panel2" x="24" y="314" width="382" height="154"/>
  <text class="tiny" x="42" y="331">Asset</text>
  <text class="tiny" x="126" y="331">Source Object</text>
  <text class="tiny" x="235" y="331">Locator</text>
  <text class="tiny" x="330" y="331">USD Mode</text>

  <rect class="rowSelected" x="34" y="340" width="362" height="30"/>
  <rect class="check" x="43" y="349" width="12" height="12" rx="1"/>
  <path d="M46 355 L49 358 L53 352" fill="none" stroke="#f2f2f2" stroke-width="1.6"/>
  <text class="textBold" x="62" y="359">Chair_A</text>
  <text class="text" x="126" y="359">chairA_geo</text>
  <text class="text" x="235" y="359">Chair_A_LOC</text>
  <rect class="pillRef" x="330" y="348" width="54" height="14" rx="2"/>
  <text class="pillText" x="340" y="359">Reference</text>

  <rect class="row" x="34" y="374" width="362" height="30"/>
  <rect class="check" x="43" y="383" width="12" height="12" rx="1"/>
  <path d="M46 389 L49 392 L53 386" fill="none" stroke="#f2f2f2" stroke-width="1.6"/>
  <text class="textBold" x="62" y="393">Chair_B</text>
  <text class="text" x="126" y="393">chairB_geo</text>
  <text class="text" x="235" y="393">Chair_B_LOC</text>
  <rect class="pillInst" x="330" y="382" width="54" height="14" rx="2"/>
  <text class="pillText" x="342" y="393">Instance</text>

  <rect class="row" x="34" y="408" width="362" height="30"/>
  <rect class="emptyCheck" x="43" y="417" width="12" height="12" rx="1"/>
  <text class="textBold" x="62" y="427">Table_A</text>
  <text class="text" x="126" y="427">table_geo</text>
  <text class="text" x="235" y="427">Table_A_LOC</text>
  <rect class="pillRef" x="330" y="416" width="54" height="14" rx="2"/>
  <text class="pillText" x="340" y="427">Reference</text>

  <rect class="secondary" x="34" y="444" width="92" height="18" rx="1"/>
  <text class="buttonText" x="51" y="457">Add Selection</text>
  <rect class="secondary" x="132" y="444" width="92" height="18" rx="1"/>
  <text class="buttonText" x="148" y="457">Remove Row</text>
  <rect class="secondary" x="230" y="444" width="110" height="18" rx="1"/>
  <text class="buttonText" x="245" y="457">Refresh From Maya</text>

  <text class="section" x="24" y="493">Placement Settings</text>
  <text class="label" x="50" y="518">Asset</text>
  <rect class="field" x="92" y="505" width="110" height="20"/>
  <text class="text" x="98" y="519">Chair</text>
  <path d="M190 513 L196 513 L193 517 Z" fill="#bdbdbd"/>

  <text class="label" x="221" y="518">USD Mode</text>
  <rect class="field" x="278" y="505" width="100" height="20"/>
  <text class="text" x="284" y="519">Reference</text>
  <path d="M366 513 L372 513 L369 517 Z" fill="#bdbdbd"/>

  <text class="label" x="47" y="546">Variant</text>
  <rect class="field" x="92" y="533" width="110" height="20"/>
  <text class="text" x="98" y="547">default</text>
  <text class="label" x="240" y="546">Subset</text>
  <rect class="field" x="278" y="533" width="100" height="20"/>
  <text class="text" x="284" y="547">proxy</text>

  <text class="label" x="35" y="574">Locator</text>
  <rect class="field" x="92" y="561" width="286" height="20"/>
  <text class="text" x="98" y="575">Chair_A_LOC</text>

  <rect class="check" x="92" y="595" width="12" height="12" rx="1"/>
  <path d="M95 601 L98 604 L102 598" fill="none" stroke="#f2f2f2" stroke-width="1.6"/>
  <text class="text" x="112" y="605">Hide source objects</text>
  <rect class="check" x="238" y="595" width="12" height="12" rx="1"/>
  <path d="M241 601 L244 604 L248 598" fill="none" stroke="#f2f2f2" stroke-width="1.6"/>
  <text class="text" x="258" y="605">Create locator at source transform</text>

  <rect class="secondary" x="92" y="619" width="134" height="22" rx="1"/>
  <text class="buttonText" x="113" y="634">Apply to Selected Rows</text>
  <rect class="secondary" x="236" y="619" width="142" height="22" rx="1"/>
  <text class="buttonText" x="259" y="634">Apply to Same Asset</text>

  <line class="line" x1="24" y1="655" x2="406" y2="655"/>
  <rect class="panel2" x="24" y="667" width="166" height="24"/>
  <circle class="ok" cx="38" cy="679" r="3"/>
  <text class="tiny" x="46" y="682">3 sources</text>
  <circle class="ok" cx="92" cy="679" r="3"/>
  <text class="tiny" x="100" y="682">2 selected</text>
  <circle class="warn" cx="154" cy="679" r="3"/>
  <text class="tiny" x="162" y="682">USD tags</text>

  <rect class="primary" x="202" y="665" width="190" height="28" rx="1"/>
  <text class="buttonText" x="233" y="683">Extract and Place Assets</text>
</svg>
