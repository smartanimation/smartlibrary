<svg xmlns="http://www.w3.org/2000/svg" width="430" height="720" viewBox="0 0 430 720">
  <defs>
    <style>
      .bg { fill: #242424; }
      .panel { fill: #343434; }
      .panel2 { fill: #2c2c2c; }
      .panel3 { fill: #383838; }
      .field { fill: #202020; stroke: #454545; stroke-width: 1; }
      .fieldFocus { fill: #202020; stroke: #2f78b7; stroke-width: 1.5; }
      .button { fill: #424242; }
      .primary { fill: #2f6f9f; }
      .secondary { fill: #4a4a4a; }
      .row { fill: #292929; stroke: #424242; stroke-width: 1; }
      .rowSelected { fill: #24384a; stroke: #2f78b7; stroke-width: 1.2; }
      .text { fill: #d8d8d8; font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; }
      .textBold { fill: #eeeeee; font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: 600; }
      .label { fill: #b8b8b8; font-family: "Segoe UI", Arial, sans-serif; font-size: 9px; }
      .tiny { fill: #9a9a9a; font-family: "Segoe UI", Arial, sans-serif; font-size: 8px; }
      .title { fill: #f2f2f2; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .section { fill: #d0d0d0; font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: 600; }
      .buttonText { fill: #f3f3f3; font-family: "Segoe UI", Arial, sans-serif; font-size: 9px; font-weight: 600; }
      .pillText { fill: #ffffff; font-family: "Segoe UI", Arial, sans-serif; font-size: 8px; font-weight: 600; }
      .line { stroke: #474747; stroke-width: 1; }
      .check { fill: #2f6f9f; stroke: #8fb9d7; stroke-width: 1; }
      .emptyCheck { fill: #1e1e1e; stroke: #5a5a5a; stroke-width: 1; }
      .pillRef { fill: #3b6f9e; }
      .pillInst { fill: #6f8f45; }
      .ok { fill: #76b875; }
      .warn { fill: #d7a85e; }
    </style>
