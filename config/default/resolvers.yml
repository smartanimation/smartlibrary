asset_resolvers:
  - consumer: sequence
    department: layout
    context: WORK
    version: approved
    formats: [ma, mb, usd]
    fallback_contexts: [FAST]
    fallback_version: latest

  - consumer: shot
    department: layout
    context: WORK
    version: approved
    formats: [ma, mb, usd]
    fallback_contexts: [FAST]
    fallback_version: latest

  - consumer: shot
    department: anim
    context: WORK
    version: approved
    formats: [ma, mb]
    fallback_contexts: [FAST]
    fallback_version: latest

  - consumer: shot
    department: lighting
    context: REND
    version: approved
    formats: [usd, usda, usdc]
    fallback_contexts: [WORK, FAST]
    fallback_version: latest

  - consumer: shot
    department: default
    context: WORK
    version: approved
    formats: [ma, mb]
    fallback_contexts: [FAST]
    fallback_version: latest

  - consumer: external
    department: unreal
    context: REND
    version: released
    formats: [fbx, usd]
    fallback_contexts: []
    fallback_version: latest

  - consumer: external
    department: mocap
    context: MCP
    version: released
    formats: [fbx]
    fallback_contexts: []
    fallback_version: latest
