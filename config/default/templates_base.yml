anchors:
  project_name: "PROJECTCODE"
  project_root: "D:/Projects/PROJECTCODE"
  fps: 24
  resolution: [1920, 1080]

review_build:
  maya_software: ""

# Shot用の部署リスト
shot_depts:
  - layout
  - anim
  - fx
  - light
  - comp

# Workspace上の上位区分。Departmentとは独立して管理する。
shot_dept_partitions:
  default: cg
  layout: cg
  anim: cg
  fx: cg
  light: cg
  comp: cg

shot_tasks:
  layout:
    - main
    - final_camera
  anim:
    - main
    - preComp
    - animation
    - shot_sculpt
  fx:
    - main
  light:
    - main
  comp:
    - main

# Asset用の部署リスト
asset_depts:
  - model
  - rig
  - look
  - assembly

templates:
  # プロジェクト直下の主要フォルダ
  production_root: "{project_root}/production"
  assets_root: "{production_root}/assets"
  assemblies_root: "{production_root}/assemblies"
  sequences_root: "{production_root}/sequences"
  shots_root: "{production_root}/shots"
  art_root: "{workspace_root}/art"
  editorial_root: "{workspace_root}/editorial"
  editorial_data_root: "{production_root}/editorial/data"
  setting_root: "{production_root}/settings"
  delivery_root: "{project_root}/delivery"
  deliveries_vendors_dir: "{delivery_root}/vendors"
  delivery_vendor_root: "{deliveries_vendors_dir}/{studio_id}"
  delivery_vendor_batch: "{delivery_vendor_root}/{delivery_batch}"
  delivery_vendor_package: "{delivery_vendor_batch}/{entity}.zip"
  deliveries_client_dir: "{delivery_root}/client"
  deliveries_archive_dir: "{delivery_root}/archive"
  incoming_root: "{project_root}/incoming"
  incoming_editorial_dir: "{incoming_root}/editorial"
  incoming_client_dir: "{incoming_root}/client"
  incoming_vendors_dir: "{incoming_root}/vendors"
  library_root: "{project_root}/library"
  users_root: "{project_root}/users"
  workspace_root: "{project_root}/workspace"
  delivery_staging_root: "{workspace_root}/delivery"

  # さらにその下の階層も必要なら追加
  tool_dir: "{setting_root}/tools"

maya_timeline:
  # normalized: Maya work ranges start at normalized_start.
  # editorial: Maya cut ranges retain the Editorial cut_in/cut_out values.
  mode: normalized
  normalized_start: 1001
