anchors:
  project_name: "PROJECTCODE"
  project_root: "D:/Projects/PROJECTCODE"
  fps: 24
  resolution: [1920, 1080]

# Shot用の部署リスト
shot_depts:
  - layout
  - anim
  - fx
  - light
  - comp

shot_tasks:
  layout:
    - rough_layout
    - final_camera
  anim:
    - body
    - facial
    - shot_sculpt
  fx:
    - main
  light:
    - main
  comp:
    - main

# Asset用の部署リスト
asset_depts:
  - model
  - rig
  - look

templates:
  # プロジェクト直下の主要フォルダ
  art_root: "{project_root}/art"
  assets_root: "{project_root}/assets"
  editorial_root: "{project_root}/editorial"
  previs_root: "{project_root}/previs"
  sequences_root: "{project_root}/sequences"
  shots_root: "{project_root}/shots"
  setting_root: "{project_root}/settings"
  delivery_root: "{project_root}/delivery"
  deliveries_vendors_dir: "{delivery_root}/vendors"
  deliveries_client_dir: "{delivery_root}/client"
  deliveries_archive_dir: "{delivery_root}/archive"
  incoming_root: "{project_root}/incoming"
  incoming_editorial_dir: "{incoming_root}/editorial"
  incoming_vendors_dir: "{incoming_root}/vendors"
  library_root: "{project_root}/library"
  users_root: "{project_root}/users"
  workspace_root: "{project_root}/workspace"

  # さらにその下の階層も必要なら追加
  tool_dir: "{setting_root}/tools"
