presets:
  layout_geo:
    label: Layout Geometry
    display:
      display_appearance: smoothShaded
      use_default_material: true
      display_textures: false
      image_planes: false
      display_lights: default
      shadows: false
      grid: true

  layout_material:
    label: Layout Material
    display:
      display_appearance: smoothShaded
      use_default_material: false
      display_textures: true
      image_planes: false
      display_lights: default
      shadows: false
      grid: true

  layout_lighting:
    label: Layout Lighting
    display:
      display_appearance: smoothShaded
      use_default_material: false
      display_textures: true
      image_planes: false
      display_lights: all
      shadows: true
      grid: false
