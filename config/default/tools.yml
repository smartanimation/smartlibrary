tools:
  openrv:
    path: ""
  ffmpeg:
    path: "{smartpipeline_root}/tools/ffmpeg/ffmpeg.exe"
dcc:
  maya:
    plugins:
      required:
        - mayaUsdPlugin
      optional:
        - AbcExport
        - fbxmaya
    scene_policy:
      unit:
        linear: centimeter
        angle: degree
        time_from_fps: true
      up_axis: y
      playback:
        set_range_from_context: true
