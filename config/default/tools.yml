tools:
  openrv:
    path: "{smartpipeline_tools}/openrv/rv.exe"
  ffmpeg:
    path: "{smartpipeline_tools}/ffmpeg/ffmpeg.exe"
  usdcat:
    path: "{smartpipeline_root}/tools/usd/usdcat.bat"
  usdview:
    path: "{smartpipeline_root}/tools/usd/usdview.bat"
dcc:
  maya:
    plugins:
      required:
        - mayaUsdPlugin
      optional:
        - AbcExport
        - fbxmaya
    scene_policy:
      unit:
        linear: centimeter
        angle: degree
        time_from_fps: true
      up_axis: y
      playback:
        set_range_from_context: true
