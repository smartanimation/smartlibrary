schema_version: 1
default_review_profile: fast_default

# Applies to maya_playblast profiles. GUI Maya is launched only on cache misses.
gui_playblast:
  startup_timeout_seconds: 180
  stall_timeout_seconds: 300

review_profiles:
  fast_default:
    stage: FAST
    dcc: maya
    renderer: maya_hardware2
    image_format: png
    bit_depth: 8
    alpha: true
    resolution_scale: 0.5
    fps: project
    frame_range: shot
    overscan: 1.0
    precomp: latest_approved

  work_default:
    extends: fast_default
    stage: WORK
    renderer: maya_playblast

  rend_default:
    extends: work_default
    stage: REND
    renderer: maya_render
    image_format: exr
    bit_depth: 16
    compression: zip

delivery_profiles:
  internal:
    review_profile: fast_default
    container: mov
    codec: prores_422_proxy
    filename: "{shot}_{department}_review_{version}.mov"
    target_template: "{shot_root}/review/{department}/{profile}/{version}"
    include: [movie, thumbnail, review_metadata, source_manifest]

missing_precomp_policy: allow_project_default
default_precomp: "{project_root}/templates/review/base_comp.aep"

jobs:
  retain_success_days: 3
  retain_failed_days: 30
  retain_logs_days: 90
