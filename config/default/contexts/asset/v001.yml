name: asset
version: 1

stage_profiles:
  FAST:
    character: LO
    environment: PROXY
    prop: LO
    purpose: proxy
    load_payloads: false
    load_crowds: false
  WORK:
    character: ANIM
    environment: PROXY
    prop: LO
    purpose: proxy
    load_payloads: true
    load_crowds: true
  REND:
    character: REND
    environment: REND
    prop: REND
    purpose: render
    load_payloads: true
    load_crowds: true

quality_profiles:
  LO:
    model: low
    look: low
    rig: layout
    groom: none
  ANIM:
    model: low
    look: low
    rig: anim
    groom: none
  REND:
    model: high
    look: high
    rig: anim
    groom: render
  MCP:
    model: low
    look: none
    rig: mocap
    groom: none
  PROXY:
    assembly: proxy
    look: none

asset_context_recipes:
  character:
    inherit_common_profiles: false
    match:
      asset_type:
        - CH
        - character
        - characters
    profiles:
      LO:
        model: low
        look: low
        rig: layout
        groom: none
      ANIM:
        model: low
        look: low
        rig: anim
        groom: none
      REND:
        model: high
        look: high
        rig: anim
        groom: render
      MCP:
        model: low
        look: none
        rig: mocap
        groom: none

  environment:
    inherit_common_profiles: false
    match:
      asset_type:
        - BG
        - env
        - environment
        - set
    profiles:
      PROXY:
        assembly: proxy
        look: none
      REND:
        assembly: render
        look: high

  prop:
    inherit_common_profiles: false
    match:
      asset_type:
        - prop
    profiles:
      LO:
        model: proxy
        look: none
      REND:
        model: render
        look: high

viewport:
  background: bbox
  textures: low

fallbacks:
  look:
    high: low
  rig:
    anim: layout
