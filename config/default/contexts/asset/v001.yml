name: asset
version: 1

stage_profiles:
  FAST:
    character: CHAR_LO
    environment: BG_PROXY
    prop: PROP_LO
    vehicle: PROP_LO
    purpose: proxy
    load_payloads: false
    load_crowds: false
  WORK:
    character: CHAR_ANIM
    environment: BG_PROXY
    prop: PROP_LO
    vehicle: PROP_LO
    purpose: proxy
    load_payloads: true
    load_crowds: true
  REND:
    character: CHAR_REND
    environment: BG_REND
    prop: PROP_REND
    vehicle: PROP_REND
    purpose: render
    load_payloads: true
    load_crowds: true

quality_profiles:
  CHAR_LO:
    model: low
    look: low
    rig: layout
    groom: none
  CHAR_ANIM:
    model: low
    look: low
    rig: anim
    groom: none
  CHAR_REND:
    model: high
    look: high
    rig: anim
    groom: render
  CHAR_MCP:
    model: low
    look: none
    rig: mocap
    groom: none
  BG_PROXY:
    assembly: proxy
    look: none
  BG_REND:
    assembly: render
    look: high
  PROP_LO:
    model: low
    look: low
    rig: layout
  PROP_ANIM:
    model: low
    look: low
    rig: anim
  PROP_REND:
    model: high
    look: high

profile_labels:
  CHAR_LO: LO
  CHAR_ANIM: ANIM
  CHAR_REND: REND
  CHAR_MCP: MCP
  BG_PROXY: PROXY
  BG_REND: REND
  PROP_LO: LO
  PROP_ANIM: ANIM
  PROP_REND: REND

asset_context_recipes:
  character:
    match:
      asset_type:
        - character
    profile_names:
      - CHAR_LO
      - CHAR_ANIM
      - CHAR_REND
      - CHAR_MCP

  environment:
    match:
      asset_type:
        - environment
    profile_names:
      - BG_PROXY
      - BG_REND

  prop:
    match:
      asset_type:
        - prop
    profile_names:
      - PROP_LO
      - PROP_ANIM
      - PROP_REND


  vehicle:
    match:
      asset_type:
        - vehicle
    profile_names:
      - PROP_LO
      - PROP_ANIM
      - PROP_REND
viewport:
  background: bbox
  textures: low

fallbacks:
  look:
    high: low
  rig:
    anim: layout
