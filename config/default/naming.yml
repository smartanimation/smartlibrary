shot_naming:
  profiles:
    editorial:
      prefix: sh
      start: 10
      step: 10
      padding: 4

    cut:
      prefix: c
      start: 1
      step: 1
      padding: 3

resolve_export:
  shot_naming_profile: cut

smart_ingest:
  editorial:
    # Editorial structures and linked media have independent version streams.
    episode_prefixes: [ep]
    sequence_prefixes: [seq, sq, s]
    filename: "{episode}_{sequence}{extension}"
    roles:
      edit_source:
        extensions: [aaf, edl, xml, otio]
      offline:
        extensions: [mov, mp4, wav]
      shot_media:
        extensions: [mov, mp4]

smart_playblast:
  filename: "{project}*{episode}*{sequence}*{shot}*{dept}*{preview}*v{version}*t{take}*####.{ext}"
