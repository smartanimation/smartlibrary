shot_naming:
  profiles:
    editorial:
      prefix: sh
      start: 10
      step: 10
      padding: 4

    cut:
      prefix: c
      start: 1
      step: 1
      padding: 3

resolve_export:
  shot_naming_profile: cut

smart_ingest:
  editorial:
    # One client delivery is ingested as a versioned source package.
    subset: source
    episode_prefixes: [ep]
    sequence_prefixes: [seq, sq, s]
    filename: "{episode}_{sequence}{extension}"
