templates:
  # ショットのルート定義
  shot_root: "{shots_root}/{episode}/{seq}/{shot}"
  shot_data_root: "{shot_root}/data"
  shot_publish_root: "{shot_root}/publish"
  shot_workspace_root: "{workspace_root}/{workspace_partition}/shots/{episode}/{sequence}/{shot}"
  shot_output_root: "{shot_workspace_root}/output"
  shot_render_root: "{shot_workspace_root}/render"
  shot_review_root: "{shot_workspace_root}/review"
  shot_review_movie: "{shot_review_root}/{department}/mov"
  shot_render_layers_root: "{shot_render_root}/{department}/layers"
  shot_render_layer_root: "{shot_render_layers_root}/{layer}"
  shot_render_layer_version: "{shot_render_layer_root}/{version}"
  shot_render_layer_take: "{shot_render_layer_version}/{take}"
  shot_review_build_root: "{shot_review_root}/review_build"
  shot_review_build: "{shot_review_build_root}/{version}/{take}"
  shot_work_root: "{shot_workspace_root}/work"
  shot_work: "{shot_work_root}/{department}/{dcc}"
  sequence_work_root: "{workspace_root}/{workspace_partition}/sequences/{episode}/{sequence}/work"
  sequence_work: "{sequence_work_root}/{department}"
  shot_build_root: "{workspace_root}/{workspace_partition}/shots/{episode}/{sequence}/{shot}/build"
  shot_build: "{shot_build_root}/{department}/{dcc}/{task}/{version}"
  sequence_build_root: "{workspace_root}/{workspace_partition}/sequences/{episode}/{sequence}/build"
  sequence_build: "{sequence_build_root}/{department}/{dcc}/{task}/{version}"

  # work の下に各部署（anim, lighting等）を展開
  dept_work: "{shot_root}/work/{dept}"

  # ショット直下の共通フォルダ
  dept_data: "{shot_data_root}"
  dept_output: "{shot_output_root}"
  dept_publish: "{shot_publish_root}"
  dept_render: "{shot_render_root}"
  output_review: "{shot_root}/output/review/{dept}/{layer}/{version}/{take}"
  publish_review: "{shot_root}/publish/review/{dept}/{layer}/{version}/{take}"
  output_review_build: "{shot_review_build_root}/{version}/{take}"
  publish_review_build: "{shot_root}/publish/review/{dept}/review_build/{version}/{take}"

sequence_data:
  types:
    - virtual_camera
    - mocap
