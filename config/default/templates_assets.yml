templates:
  asset_root: "{project_root}/assets/{category}/{group}/{asset_name}"
  asset_data_root: "{asset_root}/{variant}/data"
  asset_publish_root: "{asset_root}/{variant}/publish"
  asset_reference_root: "{asset_root}/{variant}/reference"
  asset_work_root: "{workspace_root}/assets/{category}/{group}/{asset_name}/{variant}/work"
  asset_work: "{asset_work_root}/{department}"

  # main areas
  dept_work: "{asset_root}/work"
  dept_data: "{asset_data_root}"
  dept_publish: "{asset_publish_root}"
  dept_reference: "{asset_reference_root}"

  # work is DCC-first and keeps take numbers in file names.
  work_scene_dir: "{asset_root}/{variant}/work/{department}/{dcc}/{subset}"
  work_scene_file: "{project_name}_{asset_name}_{department}_{variant}_{version}_{take}.{ext}"
  publish_scene_file: "{asset_name}_{variant}_{version}.{ext}"
  work_maya_model_hires: "{dept_work}/maya/model/hires"
  work_maya_model_proxy: "{dept_work}/maya/model/proxy"
  work_maya_model_render: "{dept_work}/maya/model/render"
  work_maya_model_guide: "{dept_work}/maya/model/guide"
  work_maya_rig_layout: "{dept_work}/maya/rig/layout"
  work_maya_rig_anim: "{dept_work}/maya/rig/anim"
  work_maya_look_low: "{dept_work}/maya/look/low"
  work_maya_look_high: "{dept_work}/maya/look/high"
  work_maya_groom: "{dept_work}/maya/groom"
  work_substance: "{dept_work}/substance"
  work_mari: "{dept_work}/mari"
  work_zbrush: "{dept_work}/zbrush"
  work_houdini: "{dept_work}/houdini"

  # data stores reusable build/cache inputs.
  data_rig_skin: "{dept_data}/rig/skin"
  data_rig_guide: "{dept_data}/rig/guide"
  data_rig_build: "{dept_data}/rig/build"
  data_groom: "{dept_data}/groom"
  data_sim: "{dept_data}/sim"

  # publish is versioned and take-less.
  publish_model_hires_ma: "{dept_publish}/model/hires/ma"
  publish_model_hires_fbx: "{dept_publish}/model/hires/fbx"
  publish_model_hires_abc: "{dept_publish}/model/hires/abc"
  publish_model_hires_usd: "{dept_publish}/model/hires/usd"
  publish_model_guide_ma: "{dept_publish}/model/guide/ma"
  publish_model_guide_usd: "{dept_publish}/model/guide/usd"
  publish_rig_layout: "{dept_publish}/rig/layout"
  publish_rig_anim: "{dept_publish}/rig/anim"
  publish_groom: "{dept_publish}/groom"
  publish_surfacing: "{dept_publish}/surfacing"
  publish_texture: "{dept_publish}/texture"
  publish_usd: "{dept_publish}/usd"

  reference_concept: "{dept_reference}/concept"
  reference_scan: "{dept_reference}/scan"
  reference_photo: "{dept_reference}/photo"

publish_outputs:
  model:
    default:
    - ma
    - usd
    hires:
    - ma
  rig:
    layout:
    - ma
    anim:
    - ma

# Shared subset catalog for Asset Manager and Context profile configuration.
asset_subsets:
  model: [proxy, render, low, high]
  assembly: [render]
  rig: [layout, anim]
  look: [low, high]
  groom: []

work_subsets_by_category:
  model:
    default: [proxy, render]
    characters: [low, high]
    env: [proxy, render]
    prop: [proxy, render]

# Artist workspace representation policy used by Build Manager's
# "Project Default" selection. The UI's Maya/USD choices override it per build.
workspace_load_policy:
  # Current projects are Maya-first. Change to "usd" when a project is ready
  # to use packed Asset USD as its default shot representation.
  representation: maya
  defaults:
    character:
      mode: reference
      context: WORK
    rigged_prop:
      mode: reference
      context: WORK
    prop:
      mode: payload
      context: WORK
    environment:
      mode: payload
      context: WORK
    unknown:
      mode: reference
      context: WORK
  category_classes:
    character: [CH, char, character, characters, hero]
    environment: [BG, env, environment, set, sets]
    prop: [prop, props, bp, cp]

staging_dependencies:
  model:
    default:
      variants: [default]
      department: model
      subsets: [selected]
      format: ma
  rig:
    layout:
      variants: [current, default]
      department: model
      subsets: [high, low, proxy, guide, render, hires]
      format: ma
    default:
      variants: [current, default]
      department: model
      subsets: [high, low, render, hires]
      format: ma
  look:
    default:
      variants: [current, default]
      department: model
      subsets: [render, hires]
      format: ma
  groom:
    default:
      variants: [current, default]
      department: model
      subsets: [render, hires]
      format: ma

maya_reference_groups:
  default: assets_grp
  rules:
    - group: sets_grp
      category: [env]
    - group: props_grp
      category: [prop]
    - group: character_grp
      category: [characters]
    - group: character_grp
      group_name: [hero]
